apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zomboid-server
  namespace: zomboid
  labels:
    app: zomboid-server
spec:
  serviceName: zomboid-game
  replicas: 1
  selector:
    matchLabels:
      app: zomboid-server
  template:
    metadata:
      labels:
        app: zomboid-server
    spec:
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: install-server
          image: image-registry.openshift-image-registry.svc:5000/zomboid/zomboid-server:latest
          command: ["/home/steam/install-server.sh"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      containers:
        - name: zomboid
          image: image-registry.openshift-image-registry.svc:5000/zomboid/zomboid-server:latest
          env:
            - name: SERVER_NAME
              value: zomboid
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zomboid-rcon-secret
                  key: RCON_PASSWORD
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zomboid-rcon-secret
                  key: ADMIN_PASSWORD
            - name: JVM_HEAP
              value: "5g"
          ports:
            - name: game-port
              containerPort: 16261
              protocol: UDP
            - name: query-port
              containerPort: 16262
              protocol: UDP
            - name: rcon
              containerPort: 27015
              protocol: TCP
          resources:
            requests:
              cpu: "1"
              memory: 6Gi
            limits:
              # Deliberately no CPU limit: a CPU limit does not cap usage, it
              # makes the kernel throttle the container every scheduling
              # period, which shows up as stutter in a game server. The request
              # still reserves capacity; bursting into idle node CPU is free.
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zomboid-data

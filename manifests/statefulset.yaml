apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zomboid-server
  namespace: zomboid
  labels:
    app: zomboid-server
spec:
  serviceName: zomboid-game
  replicas: 1
  selector:
    matchLabels:
      app: zomboid-server
  template:
    metadata:
      labels:
        app: zomboid-server
    spec:
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: install-server
          image: image-registry.openshift-image-registry.svc:5000/zomboid/zomboid-server:latest
          command: ["/home/steam/install-server.sh"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      containers:
        - name: zomboid
          image: image-registry.openshift-image-registry.svc:5000/zomboid/zomboid-server:latest
          env:
            - name: SERVER_NAME
              value: zomboid
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zomboid-rcon-secret
                  key: RCON_PASSWORD
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zomboid-rcon-secret
                  key: ADMIN_PASSWORD
            - name: SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zomboid-rcon-secret
                  key: SERVER_PASSWORD
            # Mod list comes from a ConfigMap, not from here - it changes far more
            # often than the deployment shape does, and it is not a secret.
            - name: WORKSHOP_ITEMS
              valueFrom:
                configMapKeyRef:
                  name: zomboid-mods
                  key: WORKSHOP_ITEMS
            - name: MODS
              valueFrom:
                configMapKeyRef:
                  name: zomboid-mods
                  key: MODS
            - name: JVM_HEAP
              value: "6g"
          ports:
            - name: game-port
              containerPort: 16261
              protocol: UDP
            - name: query-port
              containerPort: 16262
              protocol: UDP
            - name: rcon
              containerPort: 27015
              protocol: TCP
          resources:
            requests:
              cpu: "1"
              memory: 6Gi
            limits:
              # Deliberately no CPU limit: a CPU limit does not cap usage, it
              # makes the kernel throttle the container every scheduling
              # period, which shows up as stutter in a game server. The request
              # still reserves capacity; bursting into idle node CPU is free.
              #
              # Raised from 8Gi when the mod list landed: ~1.2GB of mod content
              # (Authentic Z alone is ~880MB of textures) loads into the heap and
              # into native memory on top of the vanilla footprint. The request is
              # deliberately left at 6Gi so scheduling is unchanged - this is only
              # a ceiling, and the alternative was another OOMKill.
              memory: 10Gi
          volumeMounts:
            - name: data
              mountPath: /data
            # Zomboid resolves its data dir from Java's user.home, which lands on
            # /home/steam under OpenShift's arbitrary UID. Back that path with the
            # PVC so config and world saves actually persist.
            - name: data
              mountPath: /home/steam/Zomboid
              subPath: zomboid-home
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zomboid-data
